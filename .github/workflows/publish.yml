name: Publish

on:
  workflow_dispatch:
  push:
    branches: [ "master", "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "master", "main" ]

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: splitwise_test
          POSTGRES_USER: splitwise
          POSTGRES_PASSWORD: splitwise
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U splitwise -d splitwise_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://splitwise:splitwise@127.0.0.1:5432/splitwise_app
      TEST_DATABASE_URL: postgresql://splitwise:splitwise@127.0.0.1:5432/splitwise_test
      E2E_DATABASE_URL: postgresql://splitwise:splitwise@127.0.0.1:5432/splitwise_e2e
      AUTH_SECRET: splitwise-ci-regression-secret
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Verify HTTP contract
        run: npm run test:contract

      - name: Verify language-neutral golden contract
        run: npm run test:golden

      - name: Run unit and database tests with coverage gates
        run: npm run test:coverage

      - name: Build production application
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chrome

      - name: Run browser and HTTP E2E regression suite
        run: npm run test:e2e:production

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/heads/') && (github.ref_name == 'main' || github.ref_name == 'master') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          provenance: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to server
        if: ${{ github.event_name != 'pull_request' }}
        uses: fjogeleit/http-request-action@v1
        with:
          url: ${{ secrets.REDEPLOY_WEBHOOK }}
          method: 'POST'
          ignoreStatusCodes: "204"
          timeout: 120000
